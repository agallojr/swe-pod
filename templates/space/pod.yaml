pod: 1
project: <project>                 # the <name> of proj:<name> in space.yaml
process: swe-pod-process@2         # pinned PROCESS.md version
repos:                             # one line per code repo of the project
  <repo-a>: {remote: "<url>", pin: "<sha>"}
  <repo-b>: {remote: "<url>", pin: "<sha>"}
depends: {<repo-b>: [<repo-a>]}    # merge order: <repo-a> before <repo-b>
gates: {spec: human, plan: human-skim, merge: human}
